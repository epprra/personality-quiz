<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personality Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="app">
    <h1>Personality Quiz</h1>

    <div id="quiz">
      <div id="question"></div>
      <div id="options"></div>
      <button id="nextBtn" disabled>Next</button>
    </div>

    <div id="result" hidden>
      <h2>Your Result</h2>
      <pre id="scoreOutput"></pre>
      <p><strong>Your Code:</strong></p>
      <div id="tag"></div>
      <p class="warning">
        Save this code. It cannot be recovered.
      </p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
